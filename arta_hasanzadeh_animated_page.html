<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070817">
<title>آرتا حسن‌زاده | ARTA HASANZADEH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');
:root{--cyan:#62eaff;--violet:#a78bfa;--bg:#070817}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:"Vazirmatn",Tahoma,sans-serif}
body{min-height:100svh;overflow:hidden;display:grid;place-items:center;position:relative;
background:radial-gradient(ellipse at 50% 42%,#1a1741 0%,#0d1027 38%,#070817 75%)}
body:before,body:after{content:"";position:absolute;inset:-35%;pointer-events:none}
body:before{background:repeating-linear-gradient(115deg,transparent 0 78px,rgba(98,234,255,.055) 79px,transparent 81px);transform:perspective(500px) rotateX(58deg) translateY(18%);animation:gridmove 18s linear infinite}
body:after{background:radial-gradient(circle at 50% 50%,transparent 0 28%,rgba(3,5,18,.6) 75%);z-index:1}
@keyframes gridmove{to{background-position:0 420px}}
.aurora{position:absolute;width:65vmax;height:65vmax;border-radius:50%;filter:blur(80px);opacity:.22;animation:float 12s ease-in-out infinite alternate}
.a1{background:#5736d8;top:-40%;right:-20%}.a2{background:#007f9c;bottom:-48%;left:-20%;animation-delay:-5s}
@keyframes float{to{transform:translate(8%,12%) scale(1.18)}}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.card{position:relative;z-index:2;width:min(90vw,760px);padding:clamp(34px,8vw,76px) 22px;text-align:center}
.orbit{width:clamp(112px,22vw,166px);aspect-ratio:1;margin:0 auto 30px;border:1px solid rgba(98,234,255,.48);border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 0 35px rgba(98,234,255,.14),inset 0 0 28px rgba(167,139,250,.12);animation:pulse 3.5s ease-in-out infinite}
.orbit:before,.orbit:after{content:"";position:absolute;inset:-10px;border:1px solid rgba(167,139,250,.35);border-radius:50%;transform:rotateX(65deg);animation:spin 9s linear infinite}
.orbit:after{inset:-20px;border-color:rgba(98,234,255,.2);transform:rotateY(65deg);animation-duration:14s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(425deg) rotateX(65deg)}}
@keyframes pulse{50%{box-shadow:0 0 55px rgba(98,234,255,.3),inset 0 0 36px rgba(167,139,250,.2)}}
.monogram{font-size:clamp(38px,9vw,62px);font-weight:800;letter-spacing:3px;color:#fff;text-shadow:0 0 18px rgba(98,234,255,.8)}
.eyebrow{font-size:11px;letter-spacing:5px;color:var(--cyan);text-transform:uppercase;margin-bottom:15px;opacity:0;animation:rise 1s .25s forwards}
h1{font-size:clamp(32px,8vw,66px);line-height:1.35;margin:0;font-weight:800;letter-spacing:-1.5px;background:linear-gradient(100deg,#fff 15%,#8defff 48%,#c4a7ff 80%,#fff);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite, rise 1s .55s both}
.latin{direction:ltr;font-size:clamp(13px,3vw,18px);letter-spacing:clamp(4px,1.4vw,9px);font-weight:500;color:rgba(220,231,255,.72);margin-top:13px;opacity:0;animation:rise 1s .85s forwards}
.rule{height:1px;width:min(240px,55vw);margin:30px auto;background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent);box-shadow:0 0 15px rgba(98,234,255,.55);transform:scaleX(0);animation:expand 1.2s 1.1s forwards}
.tag{font-size:13px;color:rgba(223,229,255,.7);letter-spacing:1px;opacity:0;animation:rise 1s 1.3s forwards}
@keyframes rise{from{opacity:0;transform:translateY(22px);filter:blur(7px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes expand{to{transform:scaleX(1)}}
@keyframes shine{to{background-position:220% center}}
.corner{position:absolute;z-index:2;color:rgba(185,205,255,.38);font:10px monospace;letter-spacing:2px}
.top{top:25px;left:25px}.bottom{bottom:25px;right:25px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="aurora a1"></div><div class="aurora a2"></div><canvas id="stars"></canvas>
<div class="corner top">PERSONAL PROFILE / 001</div><div class="corner bottom">ARTA HASANZADEH · 2026</div>
<main class="card">
  <div class="orbit"><div class="monogram">AH</div></div>
  <div class="eyebrow">WELCOME TO MY WORLD</div>
  <h1>آرتا حسن‌زاده</h1>
  <div class="latin">ARTA HASANZADEH</div>
  <div class="rule"></div>
  <div class="tag">یک امضا؛ یک هویت؛ یک مسیر بی‌نهایت</div>
</main>
<script>
(()=>{const c=document.getElementById('stars'),x=c.getContext('2d');let w,h,dots=[];
function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';dots=Array.from({length:Math.min(110,Math.floor(innerWidth/9))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.3,s:Math.random()*.35+.08,a:Math.random()*.65+.15}))}
function draw(){x.clearRect(0,0,w,h);for(const p of dots){p.y-=p.s*devicePixelRatio;if(p.y<0){p.y=h;p.x=Math.random()*w}x.beginPath();x.arc(p.x,p.y,p.r*devicePixelRatio,0,Math.PI*2);x.fillStyle=`rgba(151,222,255,${p.a})`;x.fill()}requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();draw()})();
</script>
</body>
</html>
